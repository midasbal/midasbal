<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" width="760" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">midasbal</title>
  <desc id="desc">Terminal window. whoami prints midasbal, the line "professionally suspicious of your happy path", and a focus line reading protocol correctness, evm and soroban.</desc>
  <defs>
    <clipPath id="card">
      <rect x="0.5" y="0.5" width="759" height="171" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="760" height="172" fill="#0d1117"/>
    <rect x="0" y="0" width="760" height="35" fill="#161b22"/>
  </g>
  <rect x="0.5" y="0.5" width="759" height="171" rx="8" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="18" r="6" fill="#30363d"/>
  <circle cx="44" cy="18" r="6" fill="#30363d"/>
  <circle cx="64" cy="18" r="6" fill="#30363d"/>
  <text x="380" y="22" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">midasbal · zsh · 80×24</text>
  <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14"><tspan fill="#3fb950">midasbal@web3</tspan><tspan fill="#6e7681"> ~ %</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
  <text x="24" y="92" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">midasbal</text>
  <text x="24" y="115" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">professionally suspicious of your happy path</text>
  <text x="24" y="137" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">focus: protocol correctness, evm + soroban</text>
  <text x="24" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14"><tspan fill="#3fb950">midasbal@web3</tspan><tspan fill="#6e7681"> ~ %</tspan><tspan fill="#e6edf3" font-size="15"> ▋</tspan></text>
</svg>
